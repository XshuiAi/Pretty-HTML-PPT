<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./docs/demo/blush-skill-intro/">
  <title>xiaoshui-Pretty PPT</title>
  <style>
    :root {
      --bg: #fff5ed;
      --ink: #141216;
      --muted: #6f6870;
      --pink: #ff4f9a;
      --line: rgba(255, 79, 154, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--bg);
      background-size: 72px 72px;
    }

    main {
      width: min(720px, calc(100vw - 40px));
      padding: 48px;
      border: 1px solid rgba(20, 18, 22, 0.12);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 24px 80px rgba(20, 18, 22, 0.08);
    }

    .eyebrow {
      display: inline-flex;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      background: var(--pink);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      padding: 14px 20px;
      border-radius: 999px;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      background: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">HTML Web PPT Skill</span>
    <h1>xiaoshui-Pretty PPT</h1>
    <p>正在跳转到在线 Demo。若页面没有自动跳转，请点击下面的按钮打开。</p>
    <a href="./docs/demo/blush-skill-intro/">打开在线 Demo</a>
  </main>
</body>
</html>
